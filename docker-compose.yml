services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notasflow
      POSTGRES_PASSWORD: notasflow
      POSTGRES_DB: notasflow
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notasflow -d notasflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    init: true
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - certificados:/data/certificados
      - xml_saida:/data/xml
    # Sem --reload: o supervisor de desenvolvimento reiniciava o processo ao
    # detectar alterações no volume e podia causar ERR_EMPTY_RESPONSE.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/saude', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build: ./backend
    restart: unless-stopped
    # concurrency=4: processa até 4 empresas em paralelo por container.
    # Para mais de ~30 empresas: `docker compose up --scale worker=3`.
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - certificados:/data/certificados
      - xml_saida:/data/xml

  beat:
    build: ./backend
    restart: unless-stopped
    # O relógio do sistema: dispara o sincronismo automático de todas as
    # empresas e a retomada dos XMLs que vieram só como resumo. Rode UMA única
    # instância (escalar o beat duplica os disparos).
    command: celery -A app.worker.celery_app beat --loglevel=info
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - certificados:/data/certificados
      - xml_saida:/data/xml

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  db_data:
  certificados:
  xml_saida:

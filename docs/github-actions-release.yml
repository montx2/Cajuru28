# =============================================================================
#  ATENÇÃO: este arquivo NÃO roda daqui.
# =============================================================================
#  O GitHub só executa workflows que estão em `.github/workflows/`. Esta cópia
#  existe no repositório porque o app de automação que mantém este projeto não
#  tem permissão para criar arquivos de workflow — para ativar, faça UMA vez:
#
#      mkdir -p .github/workflows && cp docs/github-actions-release.yml .github/workflows/release.yml
#      git add .github/workflows/release.yml && git commit -m "CI: publicar versões"
#
#  ou, direto no GitHub: aba Actions → "New workflow" → "set up a workflow
#  yourself" → cole o conteúdo deste arquivo → Commit changes.
#
#  Depois disso, publicar uma versão é: subir `versao.txt` + Actions →
#  "Publicar versão do NotasFlow" → Run workflow. Ver docs/DISTRIBUICAO.md.
# =============================================================================

name: Publicar versão do NotasFlow

# ---------------------------------------------------------------------------
# O caminho de uma correção até os computadores dos contadores
#
#   1. você muda o código na branch `main` e sobe a versão em `versao.txt`;
#   2. este workflow roda os testes, compila o programa e o instalador;
#   3. publica a release no GitHub com o instalador + `latest.json`;
#   4. cada programa instalado consulta `latest.json` (a cada 6 h e ao abrir),
#      vê que a versão é maior, baixa, confere o SHA-256 e instala sozinho.
#
# Nada disso depende de o contador fazer nada: ele vê o aviso "Versão X
# disponível" e clica em atualizar — ou deixa para depois, se estiver no meio
# de um fechamento.
#
# Como disparar: Actions → "Publicar versão do NotasFlow" → Run workflow.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a publicar (ex.: 1.1.0). Vazio = conteúdo de versao.txt"
        required: false
      notas:
        description: "O que mudou nesta versão (aparece no aviso de atualização)"
        required: false
      obrigatoria:
        description: "Marcar como atualização obrigatória (não pode ser adiada)"
        type: boolean
        default: false
  push:
    tags:
      - "v*" # publicar criando a tag: git tag v1.1.0 && git push origin v1.1.0

permissions:
  contents: write # criar a release e anexar os arquivos

jobs:
  publicar:
    name: Compilar e publicar
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------- Node
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependências do painel
        working-directory: frontend
        run: npm ci

      # -------------------------------------------------------------- Python
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop.txt

      - name: Dependências do backend
        working-directory: backend
        run: pip install -r requirements-desktop.txt

      # ------------------------------------------------------------- Testes
      # Compilar e publicar sem rodar a suíte é como publicar no escuro: uma
      # atualização automática que entrega um erro chega em TODAS as máquinas
      # ao mesmo tempo. O teste roda antes, e barra a publicação.
      - name: Testes
        working-directory: backend
        run: python -m pytest -q

      # ------------------------------------------------------------ Inno Setup
      - name: Instalar o Inno Setup
        run: choco install innosetup --no-progress -y

      # ------------------------------------------------- Empacotar e publicar
      # A versão e as notas entram por variável de ambiente (e não interpoladas
      # na linha de comando) porque texto de release vem de campo livre —
      # aspas, acento e quebra de linha não podem virar erro de shell.
      - name: Empacotar
        shell: bash
        env:
          VERSAO: ${{ inputs.versao }}
          NOTAS: ${{ inputs.notas }}
          OBRIGATORIA: ${{ inputs.obrigatoria }}
        run: |
          argumentos=()
          [ -n "$VERSAO" ] && argumentos+=(--versao "$VERSAO")
          [ -n "$NOTAS" ] && argumentos+=(--notas "$NOTAS")
          [ "$OBRIGATORIA" = "true" ] && argumentos+=(--obrigatoria)
          python scripts/empacotar.py "${argumentos[@]}"

      - name: Descobrir a versão publicada
        id: versao
        shell: bash
        run: echo "valor=$(tr -d '[:space:]' < versao.txt)" >> "$GITHUB_OUTPUT"

      - name: Publicar a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTAS: ${{ inputs.notas }}
        run: |
          versao="${{ steps.versao.outputs.valor }}"
          notas="${NOTAS:-NotasFlow $versao}"

          # Se a release já existe (republicação da mesma versão), troca os
          # arquivos em vez de falhar.
          gh release view "v$versao" >/dev/null 2>&1 \
            && gh release upload "v$versao" dist/*.exe dist/latest.json dist/*.zip --clobber \
            || gh release create "v$versao" \
                 dist/NotasFlow-Setup-*.exe \
                 dist/NotasFlow-*-portatil.zip \
                 dist/latest.json \
                 --title "NotasFlow $versao" \
                 --notes "$notas"

      - name: Resumo
        shell: bash
        run: |
          {
            echo "## NotasFlow ${{ steps.versao.outputs.valor }} publicada"
            echo ""
            echo "Os programas instalados passam a ver a versão nova na próxima"
            echo "verificação (ao abrir o programa ou a cada 6 horas)."
            echo ""
            echo "Instalador: \`dist/NotasFlow-Setup-${{ steps.versao.outputs.valor }}.exe\`"
            echo ""
            echo "Manifesto publicado (é o que o atualizador lê):"
            echo '```json'
            cat dist/latest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar os arquivos do build
        uses: actions/upload-artifact@v4
        with:
          name: NotasFlow-${{ steps.versao.outputs.valor }}
          path: |
            dist/NotasFlow-Setup-*.exe
            dist/NotasFlow-*-portatil.zip
            dist/latest.json
          retention-days: 30

      - name: service
        in: path
        required: true
        schema:
          type: string
          enum:
          - cndFederalFederal
          - cndFederalTrabalhista
          - cndFederalFGTS
          - cndFederalActiveDebit
          - declarationEsocial
          - taxRegimeValidation
          - ecdSped
          - checkPaymentFGTSDigital
          - detMessages
          - federalActiveDebit
          - cndStateSP
          - cndStateActiveDebit
          - stateFiscalSituation
          - impedimentExtract
          - stateRegistration
          - stateDecMessages
          - cndMunicipal
          - municipalActiveDebit
          - municipalDuc
          - municipalDecSP
          - municipalDebitsCampinas
          - municipalActiveDebitGuarulhos
          - municipalFiscalSituationGuarulhos
          - cndStateRJ
          - cndStateCommerceRJ
          - stateEfdRJ
          - activeDebitRioDeJaneiro
          - cndMunicipalActiveDebit
          - municipalActiveDebitRioDeJaneiro
          - municipalDebits
          - operatingLicenseFeesRioDeJaneiro
          - sanitaryLicenseRioDeJaneiro
          - sanitaryLicenseGreaterThan2019RioDeJaneiro
          - stateDetranPR
          - stateActiveDebitPR
          - stateRegistrationPR
          - municipalFiscalSituationCuritiba
          - municipalActiveDebitCuritiba
          - municipalDebitsCuritiba
          - stateActiveDebitMG
          - municipalDebitsBeloHorizonte
        example: detMessages
        description: Codigo do servico de prevencao, o mesmo usado em api/prevention/create.
      - name: document
        in: path
        required: true
        schema:
          type: string
        example: '27606890000136'
        description: CNPJ ou CPF do cliente, somente numeros. O cliente precisa estar cadastrado no
          escritorio.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        example: 1
        description: Filtro opcional, apenas para os servicos paginados.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum: [asc, desc]
          default: desc
        description: Filtro opcional, apenas para detMessages. Ordena pela data de envio (sentAt).
      - name: year

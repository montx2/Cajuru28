        '403':
          description: 'Header **Authorization** ausente. O corpo vem vazio (`[]`), sem mensagem de
            erro. É o retorno que aparece ao usar o "Try it out" do Swagger sem preencher o
            Authorize.'
          content:
            application/json:
              example: []
        '401':
          description: Header **Authorization** enviado, mas o token nao corresponde a nenhum usuario
            ativo. O corpo vem vazio (`[]`).
          content:
            application/json:
              example: []
        '422':
          description: Erro de validacao no service ou no document
          content:
            application/json:
              examples:
                serviceInvalido:
                  summary: 'Service inexistente ou desativado (ex: bankAccounts)'
                  value:
                    message: Código de serviço inválido
                    errors:
                      service:
                      - Código de serviço inválido
                documentNaoCadastrado:
                  summary: CNPJ valido, mas o cliente nao esta cadastrado no escritorio
                  value:
                    message: Cliente não cadastrado
                    errors:
                      document:
                      - Cliente não cadastrado
                documentInvalido:
                  summary: CNPJ ou CPF invalido (acumula o erro de cadastro)
                  value:
                    message: O documento informado não é válido! (and 1 more error)
                    errors:
                      document:
                      - O documento informado não é válido!
                      - Cliente não cadastrado
        '500':
          description: 'Servico sem leitura disponivel para a UF ou o municipio do cliente
            ("Service without response builder")'
          content:
            application/json:
              example:
                message: Server Error
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token de acesso do usuario que esta fazendo a requisicao. Deve ser enviado em todas
        as chamadas.
  schemas:
    OfficeCredentialList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OfficeCredential'
        meta:
          type: object
          properties:
            pagination:
              type: object
              properties:
                total:
                  type: integer
                  example: 3
                count:
                  type: integer
                  example: 3
                per_page:
                  type: integer
                  example: 20
                current_page:
                  type: integer
                  example: 1
                total_pages:
                  type: integer
                  example: 1
    OfficeCredential:
      type: object
      description: Credencial do escritorio. Senhas e a URL do certificado no armazenamento nunca sao
        retornadas.
      properties:
        id:
          type: string
          example: 6a8e0cad64f2173c62558b67
        nome:
          type: string
          example: Certificado matriz
        tipo:
          type: string
          enum:
          - Certificado
          - Login/Senha
          example: Certificado
          description: 'Certificado = certificado digital A1 (tipo 1), Login/Senha = login e senha (tipo 3).'
        principal:
          type: boolean
          example: true
          description: Credencial principal do escritorio. Só se aplica ao tipo 1.
        quantidadeClientes:
          type: integer
          example: 12
          description: Quantidade de clientes vinculados a credencial.
        clientes:
          type: array
          description: Presente apenas no detalhe. Clientes vinculados a credencial. Se o cliente nao existe
            mais no escritorio, vem com o nome gravado no vinculo e documento vazio.
          items:
            type: object
            properties:
              nome:
                type: string
                example: EMPRESA EXEMPLO LTDA
              documento:
                type: string
                example: '07284035000149'
        criadoEm:
          type: string
          example: 14/01/2026
        nomeCertificado:
          type: string
          example: JETTAX TECNOLOGIA E SERVICOS ONLINE LTDA
          description: Presente apenas no detalhe do tipo 1. Nome extraido do certificado.
        documentoCertificado:
          type: string
          example: '27606890000136'
          description: Presente apenas no detalhe do tipo 1. CNPJ extraido do certificado.
        validadeCertificado:
          type: string
          example: 31/12/2026
          description: Presente apenas no detalhe do tipo 1. Data de validade do certificado.
        vencido:
          type: boolean
          example: false
          description: Presente apenas no tipo 1. Verdadeiro quando o certificado ja venceu.
        login:
          type: string
          example: '27606890000136'
          description: Presente apenas no tipo 3.
        cidade:
          description: Presente apenas no tipo 3. Na listagem vem apenas o nome da cidade.
          oneOf:
          - type: string
            example: Sao Paulo
          - type: object
            properties:
              codigoIbge:
                type: string
                example: '3550308'
              nome:
                type: string
                example: Sao Paulo
    AlertList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        meta:
          type: object
          properties:
            pagination:
              type: object
              properties:
                count:
                  type: integer
                  example: 20
                per_page:
                  type: integer
                  example: 20
                proximoId:
                  type: string
                  nullable: true
                  description: Informe em **ultimoId** para buscar a página seguinte. Nulo na última página.
    Alert:
      type: object
      properties:
        id:
          type: string
          example: 6a8e0cad64f2173c62558b67
        documento:
          type: string
          example: '07284035000149'
          description: CNPJ do cliente no momento em que o alerta foi gerado.
        empresa:
          type: string
          example: EMPRESA EXEMPLO LTDA
        origem:
          type: string
          enum: [certificado, nfe, nfce]
        tipo:
          type: string
          enum:
          - CERTIFICADO_VENCIDO
          - CERTIFICADO_A_VENCER
          - NFE_ENTRADA_PARALISADA
          - NFE_ENTRADA_ACUMULADA
          - NFE_ENTRADA_BLOQUEADA_SEFAZ
          - NFE_SEM_IMPORTACAO
          - NFE_SAIDA_PARALISADA
          - NFCE_PARALISADA
          - NFCE_SEM_IMPORTACAO
          - NFCE_UF_NAO_ATENDIDA
        titulo:
          type: string
          example: Captura de NF-e de entrada paralisada
        severidade:
          type: string
          enum: [alta, media, baixa]
        situacao:
          type: string
          enum: [aberto, resolvido]
        detectadoEm:
          type: string
          example: '2026-08-17 04:02:11'
          description: Quando o problema foi detectado pela primeira vez.
        verificadoEm:
          type: string
          example: '2026-08-26 04:01:52'
          description: Última verificação que confirmou o problema. Use em **atualizadoDesde**.
        detalhes:
          type: object
          description: 'Campos variam conforme o **tipo**:


            CERTIFICADO_VENCIDO: venceuEm, modulosAfetados.

            CERTIFICADO_A_VENCER: venceEm, diasRestantes, modulosAfetados.

            NFE_ENTRADA_PARALISADA: paradaDesde, diasParado, documentosPendentes.

            NFE_ENTRADA_ACUMULADA: documentosPendentes, ultimaCaptura, ultimaDistribuicao,
            ultimoDocumentoSefaz, ultimoDocumentoBaixado, buscaHoraEmHora.

            NFE_ENTRADA_BLOQUEADA_SEFAZ: codigoSefaz, mensagemSefaz, ultimaTentativa,
            documentosPendentes, ultimoDocumentoSefaz, ultimoDocumentoBaixado, buscaHoraEmHora.

            NFE_SEM_IMPORTACAO: notasSincronizadas.

            NFE_SAIDA_PARALISADA: diasParado, seriesAfetadas, series.

            NFCE_PARALISADA: diasParado, notasAfetadas, notas.

            NFCE_SEM_IMPORTACAO: notasSincronizadas.

            NFCE_UF_NAO_ATENDIDA: uf.


            **modulosAfetados** informa quais capturas param com o certificado vencido
            (nfeEntrada, nfce, nfse, das).


            **ultimoDocumentoSefaz** e **ultimoDocumentoBaixado** são os contadores de
            documentos (NSU) da distribuição na SEFAZ: a diferença entre eles é
            **documentosPendentes**, e a evolução entre duas leituras mostra se a fila está
            sendo consumida. **buscaHoraEmHora** indica se o cliente busca de hora em hora
            (cerca de 20 mil documentos por dia) ou apenas na madrugada.


            **series** e **notas** detalham o que está parado. Cada item de **series** traz
            serie, notasCapturadas, ultimaEmissao, ultimaCaptura e diasParado; cada item de
            **notas** traz numero, serie, emitidaEm e diasParado. São listas limitadas a 50
            itens; o total continua em **seriesAfetadas** e **notasAfetadas**.'
          example:
            documentosPendentes: 97340
            ultimaCaptura: '2026-08-26'
            ultimaDistribuicao: '2026-08-26'
            ultimoDocumentoSefaz: 100097
            ultimoDocumentoBaixado: 2757
            buscaHoraEmHora: true
        acoesSugeridas:
          type: array
          items:
            type: string
          description: 'O que fazer a respeito do alerta, na ordem em que faz sentido tentar.
            É a mesma orientação exibida no painel da Jettax, fixa por **tipo**: pode ser
            renderizada direto na sua tela ou no e-mail enviado ao cliente.'
          example:
          - Verificar se o volume é esperado para o perfil do cliente
          - Acompanhar ultimoDocumentoBaixado nas próximas leituras para confirmar que a fila
            está sendo consumida
          - Acionar o suporte da Jettax para avaliar o adiantamento do ponteiro de busca
    PreventionCreateRequest:
      type: object
      required:
      - service
      - name
      - document
      - address
      properties:
        service:
          type: string
          description: Codigo do servico solicitado. Ver exemplos por orgao/municipio na documentacao
            deste endpoint.
        name:
          type: string
        document:
          type: string
          description: CNPJ do cliente
        address:
          type: object
          required:
          - city
          - zip
          - state
          properties:
            city:
              type: object
              required:

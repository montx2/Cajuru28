  /api/alerts:
    get:
      summary: Listar alertas dos clientes
      operationId: getAlerts
      tags:
      - Alertas
      description: 'Alertas de saúde da operação detectados pela Jettax para os clientes do escritório:
        certificado digital, captura de NF-e e captura de NFC-e.


        O recurso é somente leitura. Um alerta é encerrado automaticamente quando o problema deixa
        de existir, então não há ação de baixa por aqui.


        Os alertas são recalculados periodicamente. O campo **verificadoEm** informa quando a
        verificação confirmou o problema pela última vez, e é o valor a usar em **atualizadoDesde**
        para buscas incrementais. Consultar com frequência maior que a diária não traz novidade.


        Para paginar, use **ultimoId** com o valor de **meta.pagination.proximoId**.'
      parameters:
      - name: origem
        in: query
        required: false
        schema:
          type: string
          enum: [certificado, nfe, nfce]
        description: Filtro opcional
      - name: severidade
        in: query
        required: false
        schema:
          type: string
          enum: [alta, media, baixa]
        description: Filtro opcional
      - name: situacao
        in: query
        required: false
        schema:
          type: string
          enum: [aberto, resolvido]
          default: aberto
        description: Filtro opcional. Por padrão retorna apenas os alertas em aberto.
      - name: atualizadoDesde
        in: query
        required: false
        schema:
          type: string
        example: '2026-08-25 00:00:00'
        description: Filtro opcional. Retorna o que foi verificado a partir da data informada.
      - name: ultimoId
        in: query
        required: false
        schema:
          type: string
        description: Filtro opcional, para busca incremental.
      responses:
        '200':
          description: Lista de alertas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertList'
        '422':
          description: Filtro inválido

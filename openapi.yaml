  /api/prevention/get-ticket-status/{ticket}:
    get:
      summary: Consultar status de ticket de servico de prevencao
      operationId: getPreventionTicketStatus
      tags:
      - Prevention
      description: "Retorna o resultado da solictação de captura. Segue abaixo possíveis códigos de erro:\n\
        \nCode 1: Erro de processamento interno\n\nCode 2: Erro de credenciais\n\nCode 3: Intermitência\n\
        \nCode 4: Erro não mapeado\n\n**Possíveis respostas**\n\n200\n\n```\n{\n   \"service\":\"cndFederalFederal\"\
        ,\n   \"status\":\"SUCCESS\",\n   \"details\":{\n      \"url\":\"\"\n      \"dueDate\":\"2024-11-06\"\
        ,\n      \"status\":\"Negativa\"\n   }\n}\n```\n\n200\n\n```\n{\n   \"status\":\"PENDING\",\n\
        \   \"message\":\"\"\n}\n```\n\n200\n\n```\n{\n   \"service\":\"cndFederalFederal\",\n   \"status\"\
        :\"FAILED\",\n   \"details\":[\n      {\n         \"message\":\"Credenciais invalidas\",\n   \
        \      \"code\":\"2\"\n      }\n   ]\n}\n```\n\n404\n\n```\n{\n   \"message\":\"Ticket inválido\"\
        \n}\n```"
      parameters:
      - name: ticket
        in: path
        required: true
        schema:
          type: string
        example: 64baaba2e1216be42c0a7f12
        description: Id do ticket retornado na criacao da solicitacao

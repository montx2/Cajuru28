  /api/prevention/data/{service}/{document}:
    get:
      summary: Consultar dados capturados de servico de prevencao
      operationId: getPreventionServiceData
      tags:
      - Prevention
      description: 'Retorna o último resultado já capturado e armazenado para o cliente, sem criar uma
        nova solicitação. Use **api/prevention/create** para disparar uma nova captura e
        **api/prevention/get-ticket-status/{ticket}** para acompanhar o ticket.


        O retorno vem sempre dentro de **data**. O conteúdo de cada item equivale ao **details**
        devolvido em get-ticket-status para o mesmo service.


        **Serviços que só podem ser lidos aqui** (o ticket não devolve o conteúdo): detMessages,
        federalActiveDebit, stateDecMessages e municipalDecSP.


        **Serviços paginados** (retornam **data** + **meta.pagination**, navegue com o parâmetro
        **page**): detMessages, federalActiveDebit, stateDecMessages e municipalDecSP. Os demais
        retornam **data** como lista simples, sem meta. O tamanho da página é fixo no servidor.


        **Filtros por serviço**: sort (detMessages), year (ecdSped) e competence
        (checkPaymentFGTSDigital). Parâmetros não previstos para o service informado são ignorados.


        **Resolução do serviço**: serviços estaduais e municipais só respondem quando a UF e o código
        IBGE cadastrados no cliente correspondem ao serviço (ex: stateFiscalSituation atende SP,
        municipalDebitsCuritiba atende Curitiba (4106902)). Fora disso a API retorna 500 com
        "Service without response builder".


        **cndMunicipal** atende São Paulo (3550308), Belo Horizonte (3106200) e Rio de Janeiro
        (3304557), resolvendo pelo código IBGE do cliente. Os códigos cndMunicipalBeloHorizonte,
        cndMunicipalRioDeJaneiro, cndStatePR e cndStateMG existem em api/prevention/create, mas não
        têm leitura por este endpoint. O serviço bankAccounts está desativado e retorna 422.'

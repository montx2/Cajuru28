openapi: 3.0.3
info:
  title: Morfeu 360
  description: 'API responsável pelas seguintes integrações:


    - Captura e busca de notas fiscais de serviço (NFSe)


    - Captura e busca de notas fiscais de comércio (NFe, CTe e CFe)


    **URL produção**: https://morfeu360.jettax.com.br


    **Autenticação**


    Em todas as requisições deverá ser enviado o parâmetro Authorization no header contendo o token do
    usuário que está fazendo a requisição'
  version: 1.0.0
servers:
- url: https://morfeu.jettax360.com.br
  description: Producao
security:
- ApiKeyAuth: []
tags:
- name: Client
  description: Cadastro de clientes finais (empresas atendidas pelo escritorio contabil).
- name: Office Credential
  description: 'Credenciais do escritorio contabil: certificado digital A1 e login/senha
    de prefeitura.'
- name: NFSe
  description: Captura e busca de notas fiscais de servico (NFSe) e NFTS.
- name: NFTS
  description: Criacao e consulta de lotes de NFTS (Nota Fiscal de Prestacao de Servico Tomado).
- name: NFe
  description: Captura e busca de notas fiscais de comercio (NFe).
- name: NFCe
  description: Captura e busca de notas fiscais de consumidor eletronica (NFCe).
- name: CTe
  description: Captura e busca de conhecimentos de transporte eletronico (CTe).
- name: CFe
  description: Captura e busca de cupons fiscais eletronicos (CFe / SAT).
- name: Prevention
  description: 'Servicos de prevencao/compliance: CND, situacao fiscal, dividas ativas, ECD/SPED, etc,
    por orgao federal, estadual e municipal.'
paths:
  /api/clients:
    get:
      summary: Listar / buscar clientes
      operationId: getClients
      tags:
      - Client
      description: '**Filtros:**


        - cnpj


        - razaoSocial


        - codigoIbge'
      parameters:
      - name: cnpj
        in: query
        required: false
        schema:
          type: string
      - name: razaoSocial
        in: query
        required: false
        schema:
          type: string
      - name: codigoIbge
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Lista de clientes
    post:
      summary: Criar cliente
      operationId: createClient
      tags:
      - Client
      description: '**Campos obrigatórios:**


        - name


        - document


        - address


        - municipalIntegration.municipalRegistration


        A **inscrição municipal** e o **CNPJ** são únicos, não podendo repetir entre os clientes.


        **Credenciais do Portal Nacional (opcional)**


        O bloco **nationalNoteIntegration** guarda o acesso ao Portal Nacional da NFS-e, usado na
        captura de notas de serviço dos municípios atendidos pelo portal.


        - **nationalNoteIntegration.login**: CPF ou CNPJ utilizado no acesso ao portal. Validado no
        salvamento, com ou sem pontuação. Um valor que não seja CPF/CNPJ válido retorna 422.


        - **nationalNoteIntegration.password**: senha do portal.'
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: JETTAX TECNOLOGIA E SERVICOS ONLINE LTDA
              document: '27606890000136'
              address:
                city:
                  ibgeCode: '3550308'
                  name: São Paulo
                zip: '05001100'
                state: SP
              municipalIntegration:
                login: '27606890000136'
                password: senhaweb
                municipalRegistration: '1234'
                gissonlineLogin: ''
                gissonlinePassword: ''
              nationalNoteIntegration:
                login: '27606890000136'
                password: senhaportal
              digitalCertificate: ''
              digitalCertificatePassword: ''
              enableModuleHubFederal: true
              enableCTe: true
              enableNFeReceived: true
              enableNFeEmitted: true
              enableNFCE: true
      responses:
        '201':
          description: Cliente criado
        '422':
          description: Erro de validacao
          content:
            application/json:
              example:
                municipalIntegration.municipalRegistration:
                - A inscrição municipal deve ter pelo menos 3 caracteres.
                nationalNoteIntegration.nationalnoteLogin:
                - 'Login do Portal Nacional inválido: informe o CPF ou CNPJ utilizado no acesso ao portal.'
  /api/clients/{document}:
    put:
      summary: Atualizar cliente
      operationId: updateClient
      tags:
      - Client
      description: 'Pode enviar apenas os campos que deseja atualizar.


        Um bloco omitido é preservado como está. Para trocar as credenciais do Portal Nacional,
        envie **nationalNoteIntegration** com **login** e **password** juntos; o login segue
        validado como CPF/CNPJ.'
      parameters:
      - name: document
        in: path
        required: true
        schema:
          type: string
        example: '27606890000136'
        description: CNPJ do cliente
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: JETTAX TECNOLOGIA E SERVICOS ONLINE LTDA
              document: '27606890000136'
              nationalNoteIntegration:
                login: '27606890000136'
                password: senhaportal
      responses:
        '200':
          description: Cliente atualizado
        '422':
          description: Erro de validacao
          content:
            application/json:
              example:
                municipalIntegration.municipalRegistration:
                - A inscrição municipal deve ter pelo menos 3 caracteres.
                nationalNoteIntegration.nationalnoteLogin:
                - 'Login do Portal Nacional inválido: informe o CPF ou CNPJ utilizado no acesso ao portal.'
    delete:
      summary: Deletar cliente
      operationId: deleteClient
      tags:
      - Client
      parameters:
      - name: document
        in: path
        required: true
        schema:
          type: string
        example: '27606890000136'
        description: CNPJ do cliente
      responses:
        '200':
          description: Cliente deletado
        '404':
          description: Cliente nao encontrado
  /api/offices/credentials:
    get:
      summary: Listar credenciais do escritorio
      operationId: getOfficeCredentials
      tags:
      - Office Credential
      description: 'Lista as credenciais do escritorio autenticado.


        **Filtros:**


        - type: 1 (certificado digital) ou 3 (login e senha)

        - name: busca parcial pelo nome da credencial


        Senhas e a URL do certificado no S3 nunca sao retornadas.'
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: integer
          enum:
          - 1
          - 3
        example: 1
      - name: name
        in: query
        required: false
        schema:
          type: string
        example: matriz
      responses:
        '200':
          description: Lista de credenciais
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficeCredentialList'
    post:
      summary: Criar credencial do escritorio
      operationId: createOfficeCredential
      tags:
      - Office Credential
      description: "Cria uma credencial do escritorio.\n\n**Tipo 1 (certificado digital A1)**: enviar\
        \ o arquivo .pfx codificado em base64 no campo **digitalCertificate** e a senha em **digitalCertificatePassword**.\
        \ A validade e o CNPJ sao extraidos do proprio certificado.\n\n**Tipo 3 (login e senha)**: enviar\
        \ **login**, **password** e **city.ibgeCode** (codigo IBGE de 7 digitos da cidade). Cada cidade\
        \ aceita apenas uma credencial por escritorio.\n\nO campo **default** so vale para o tipo 1 e\
        \ define a credencial principal do escritorio."
      requestBody:
        required: true
        content:
          application/json:
            examples:
              certificado:
                summary: Certificado digital A1
                value:
                  type: 1
                  name: Certificado matriz
                  digitalCertificate: MIIQ...base64 do arquivo .pfx...
                  digitalCertificatePassword: senha-do-certificado
                  default: true
              loginSenha:
                summary: Login e senha de prefeitura
                value:
                  type: 3
                  name: Prefeitura de Sao Paulo
                  login: '27606890000136'
                  password: senha-de-acesso
                  city:
                    ibgeCode: 3550308
      responses:
        '201':
          description: Credencial criada
          content:
            application/json:
              example:
                id: 6a8e0cad64f2173c62558b67
        '422':
          description: Erro de validacao
          content:
            application/json:
              examples:
                camposObrigatorios:
                  summary: Campos obrigatorios
                  value:
                    type:
                    - Informe o tipo da credencial.
                    digitalCertificate:
                    - Envie o certificado digital A1 em base64.
                senhaIncorreta:
                  summary: Senha do certificado incorreta
                  value:
                    message: Senha incorreta
                    errors:
                      digitalCertificate:
                      - Senha incorreta
                certificadoExpirado:
                  summary: Certificado vencido
                  value:
                    message: Certificado expirado. 31/12/2025
                    errors:
                      digitalCertificate:
                      - Certificado expirado. 31/12/2025
  /api/offices/credentials/{id}:
    get:
      summary: Detalhar credencial do escritorio
      operationId: getOfficeCredential
      tags:
      - Office Credential
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 6a8e0cad64f2173c62558b67
        description: Identificador da credencial
      responses:
        '200':
          description: Credencial encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OfficeCredential'
        '404':
          description: Credencial nao encontrada
    put:
      summary: Atualizar credencial do escritorio
      operationId: updateOfficeCredential
      tags:
      - Office Credential
      description: 'Atualizacao parcial: envie apenas os campos que deseja alterar.


        O **type** nao e alteravel. Se for enviado, e ignorado: vale sempre o tipo gravado na credencial.


        O **name** e opcional; quando omitido, o nome atual e mantido.


        No tipo 1, o **default** pode ser alterado aqui, e quando omitido a credencial mantem a marcacao
        atual. O certificado so e reprocessado quando **digitalCertificate** vier preenchido, e nesse
        caso **digitalCertificatePassword** passa a ser obrigatorio.


        No tipo 3, **login**, **password** e **city.ibgeCode** continuam obrigatorios em toda edicao.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 6a8e0cad64f2173c62558b67
        description: Identificador da credencial
      requestBody:
        required: true
        content:
          application/json:
            examples:
              renomear:
                summary: Renomear sem trocar o certificado
                value:
                  name: Certificado matriz 2026
              marcarComoPadrao:
                summary: Marcar como credencial principal do escritorio
                value:
                  default: true
              trocarCertificado:
                summary: Substituir o certificado
                value:
                  digitalCertificate: MIIQ...base64 do novo arquivo .pfx...
                  digitalCertificatePassword: nova-senha
              loginSenha:
                summary: Editar credencial de login e senha
                value:
                  name: Prefeitura de Sao Paulo
                  login: '27606890000136'
                  password: nova-senha-de-acesso
                  city:
                    ibgeCode: 3550308
      responses:
        '202':
          description: Credencial atualizada
        '404':
          description: Credencial nao encontrada
        '422':
          description: Erro de validacao
          content:
            application/json:
              example:
                digitalCertificatePassword:
                - Informe a senha do certificado digital.
    delete:
      summary: Remover credencial do escritorio
      operationId: deleteOfficeCredential
      tags:
      - Office Credential
      description: Remove a credencial e, no tipo 1, tambem apaga o certificado do armazenamento.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 6a8e0cad64f2173c62558b67
        description: Identificador da credencial
      responses:
        '202':
          description: Credencial removida
        '404':
          description: Credencial nao encontrada
  /api/offices/credentials/{id}/clients:
    post:
      summary: Vincular clientes a credencial do escritorio
      operationId: linkOfficeCredentialClients
      tags:
      - Office Credential
      description: 'Vincula clientes do escritorio a credencial a partir do CPF/CNPJ.


        Os documentos podem vir com ou sem mascara, e documentos repetidos sao ignorados. O vinculo e
        cumulativo: clientes ja vinculados continuam vinculados, e reenviar um documento ja vinculado
        nao gera erro.


        A operacao e tudo ou nada: se algum documento nao pertencer a um cliente do escritorio, nenhum
        cliente e vinculado e a resposta lista os documentos nao encontrados em **naoEncontrados**.


        Limite de 500 documentos por requisicao.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 6a8e0cad64f2173c62558b67
        description: Identificador da credencial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - documents
              properties:
                documents:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: string
                  description: CPF ou CNPJ dos clientes a vincular.
            example:
              documents:
              - 27.606.890/0001-36
              - '07284035000149'
      responses:
        '201':
          description: Clientes vinculados
        '404':
          description: Credencial nao encontrada
        '422':
          description: Erro de validacao ou documentos que nao pertencem a clientes do escritorio
          content:
            application/json:
              examples:
                naoEncontrados:
                  summary: Documentos sem cliente no escritorio
                  value:
                    documents:
                    - 'Clientes não encontrados no escritório: 07284035000149.'
                    naoEncontrados:
                    - '07284035000149'
                semDocumentos:
                  summary: Lista vazia
                  value:
                    documents:
                    - Informe os documentos dos clientes a vincular.
    delete:
      summary: Desvincular clientes da credencial do escritorio
      operationId: unlinkOfficeCredentialClients
      tags:
      - Office Credential
      description: 'Remove o vinculo entre a credencial e os clientes informados pelo CPF/CNPJ.


        Aceita os mesmos formatos do vinculo: com ou sem mascara, sem duplicidade e ate 500 documentos
        por requisicao. Documento de cliente que nao esta vinculado a credencial e ignorado, sem erro.


        Clientes excluidos do escritorio tambem podem ser desvinculados.


        A operacao e tudo ou nada: se algum documento nao pertencer a um cliente do escritorio, nenhum
        vinculo e removido e a resposta lista os documentos nao encontrados em **naoEncontrados**.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 6a8e0cad64f2173c62558b67
        description: Identificador da credencial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - documents
              properties:
                documents:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: string
                  description: CPF ou CNPJ dos clientes a desvincular.
            example:
              documents:
              - 27.606.890/0001-36
      responses:
        '201':
          description: Clientes desvinculados. O codigo 201 vem da API Fiscal, igual ao do vinculo.
        '404':
          description: Credencial nao encontrada
        '422':
          description: Erro de validacao ou documentos que nao pertencem a clientes do escritorio
          content:
            application/json:
              example:
                documents:
                - 'Clientes não encontrados no escritório: 07284035000149.'
                naoEncontrados:
                - '07284035000149'
  /api/nfse/create-direct-request:
    post:
      summary: Criar solicitacao direta de captura de NFSe
      operationId: createNfseDirectRequest
      tags:
      - NFSe
      description: "Cria request para busca de notas.\n\nTodos os campos da chave **cliente** são obrigatórios.\n\
        \nNo campo **pa**, enviar **MA** para mês anterior e **MC** para buscar no mês atual.\n\n**Respostas**\n\
        \n201\n\n```\n{\n    \"ticket\": \"5dcdb64e4786e7.83638997\",\n}\n```\n\n401\n\n```\n{\n    \"\
        message\": \"Dados de acesso inválidos\",\n}\n```\n\n403\n\n```\n{\n    \"message\": \"Token não\
        \ encontrado\",\n}\n```\n\n400\n\n```\n{\n    \"message\": \"Certificado ou credenciais não informadas\"\
        ,\n}\n```"
      requestBody:
        required: true
        content:
          application/json:
            example:
              pa: MA
              name: JETTAX TECNOLOGIA E SERVICOS ONLINE LTDA
              document: '27606890000136'
              address:
                city:
                  ibgeCode: '3550308'
                  name: São Paulo
                zip: '05001100'
                state: SP
              municipalIntegration:
                login: '27606890000136'
                password: senhaweb
                municipalRegistration: '1234'
                gissonlineLogin: ''
                gissonlinePassword: ''
              digitalCertificate: ''
              digitalCertificatePassword: ''
              taxRegimeCode: SN
      responses:
        '201':
          description: Ticket criado
          content:
            application/json:
              example:
                ticket: 5dcdb64e4786e7.83638997
        '400':
          description: Certificado ou credenciais nao informadas
        '401':
          description: Dados de acesso invalidos
        '403':
          description: Token nao encontrado
  /api/nfse/invoices/{document}:
    get:
      summary: Buscar notas de NFSe
      operationId: searchNfseInvoices
      tags:
      - NFSe
      description: '**Filtros**


        O ultimo parametro da URL é o CNPJ do cliente.


        Todos os filtros são via GET.


        Número da nota: **numero.**


        Situação da nota: **notaSituacao**. Informar **autorizada** ou **cancelada**


        Tipo da nota: **tipoNota**. Informar **enviada**, **recebida** ou **nfts**


        Competência: **period**. Formato m-Y


        Se informar o parâmetro **simpleResponse=true**, vamos retornar um json com menos dados.


        **Arquivos da nota**


        **url**: link temporário (presigned, válido por 12 horas) para o XML/TXT da nota.


        **urlPDF**: link para o PDF da nota. Se o arquivo estiver no storage da Jettax, é um link
        temporário (presigned, válido por 12 horas); se a prefeitura só disponibilizar um link de
        visualização, retornamos esse link original.


        **Atenção:** o PDF é obtido depois que a nota é baixada, então pode haver atraso até o campo
        ser preenchido. Além disso, algumas prefeituras não fornecem o PDF. Nesses casos **urlPDF**
        vem vazio (""), trate-o como um dado opcional.


        **Response**


        Ver exemplo de response ao lado ==>>>>>'
      parameters:
      - name: document
        in: path
        required: true
        schema:
          type: string
        example: '96433156000135'
        description: CNPJ do cliente
      - name: numero
        in: query
        required: false
        schema:
          type: string
        description: Numero da nota
      - name: notaSituacao
        in: query
        required: false
        schema:
          type: string
          enum:
          - autorizada
          - cancelada
        description: Situacao da nota
      - name: tipoNota
        in: query
        required: false
        schema:
          type: string
          enum:
          - enviada
          - recebida
          - nfts
        description: Tipo da nota
      - name: period
        in: query
        required: false
        schema:
          type: string
        description: Competencia, formato m-Y
      - name: simpleResponse
        in: query
        required: false
        schema:
          type: boolean
        description: Se true, retorna um JSON com menos dados
      responses:
        '200':
          description: Lista de notas de NFSe
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          description: Link temporário (presigned, 12 horas) para o XML/TXT da nota.
                        urlPDF:
                          type: string
                          description: Link para o PDF da nota. Presigned (12 horas) quando está
                            no storage da Jettax, ou o link original da prefeitura. O PDF é obtido
                            depois do download da nota, então pode chegar com atraso, e algumas
                            prefeituras não o fornecem; nesses casos vem vazio.
                          example: ''
  /api/nfse/cities:
    get:
      summary: Listar cidades atendidas
      operationId: getNfseCities
      tags:
      - NFSe
      description: "Retorna a lsita de cidades atendidas e suas funcionalidades para a API.\n\n**Filtros**\n\
        \n  \nTodos os filtros são via GET.  \n\nNome do munícipio: **city****.**\n\nEstado: **state****.**\n\
        \nCódigo IBGE: **ibgeCode****.**\n\nParceiro: **partner****.**\n\n**Response**\n\n  \nVer exemplo\
        \ de response ao lado ==>>>>>"
      parameters:
      - name: city
        in: query
        required: false
        schema:
          type: string
        description: Nome do municipio
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: Estado (UF)
      - name: ibgeCode
        in: query
        required: false
        schema:
          type: string
        description: Codigo IBGE
      - name: partner
        in: query
        required: false
        schema:
          type: string
        description: Parceiro
      responses:
        '200':
          description: Lista de cidades atendidas e suas funcionalidades
  /api/nfse/get-ticket-status/{id}:
    get:
      summary: Consultar status de ticket de captura direta de NFSe
      operationId: getNfseDirectTicketStatus
      tags:
      - NFSe
      description: "Retorna o resultado da solictação de captura. Segue abaixo possíveis códigos de erro:\n\
        \nCode 1: Erro de processamento interno\n\nCode 2: Erro de credenciais\n\nCode 3: Intermitência\
        \ na prefeitura\n\nCode 4: Erro não mapeado\n\n**Possíveis respostas**\n\n200\n\n```\n{\n  \"\
        status\": \"SUCCESS\",\n  \"process\": [\n    {\n      \"status\": \"SUCCESS\",\n      \"searchType\"\
        : \"ws\",\n      \"searchInvoiceType\": \"sale\",\n      \"message\": \"\",\n      \"code\": \"\
        \"\n    },\n    {\n      \"status\": \"SUCCESS\",\n      \"searchType\": \"crawler\",\n      \"\
        searchInvoiceType\": \"purchase\",\n      \"message\": \"\",\n      \"code\": \"\"\n    }\n  ]\n\
        }\n```\n\n200\n\n```\n{\n    \"status\": \"PENDING\",\n    \"message\": \"\",\n}\n```\n\n200\n\
        \n```\n{\n  \"status\": \"ERROR\",\n  \"process\": [\n    {\n      \"status\": \"ERROR\",\n  \
        \    \"searchType\": \"crawler\",\n      \"searchInvoiceType\": null,\n      \"message\": \"Credenciais\
        \ invalidas\",\n      \"code\": \"2\"\n    }\n  ]\n}\n```\n\n401\n\n```\n{\n    \"status\": \"\
        ERROR\",\n    \"message\": \"Dados de acesso inválidos\",\n}\n```\n\n403\n\n```\n{\n    \"message\"\
        : \"Token não encontrado\",\n}\n```\n\n404\n\n```\n{\n    \"message\": \"Ticket inválido\"\n}\n\
        ```"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 64baaba2e1216be42c0a7f12
        description: Id do ticket retornado na criacao da solicitacao
      responses:
        '200':
          description: Resultado da solicitacao de captura (sucesso, pendente ou erro)
        '401':
          description: Dados de acesso invalidos
        '403':
          description: Token nao encontrado
        '404':
          description: Ticket invalido
  /api/fiscal/nfts:
    post:
      summary: Criar lote de consulta de NFTS
      operationId: createNftsBatch
      tags:
      - NFTS
      description: Cria um lote de consulta de NFTS a partir do CNPJ do cliente e das chaves de acesso
        das notas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - document
              - invoiceIds
              properties:
                document:
                  type: string
